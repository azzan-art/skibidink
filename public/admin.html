<body class="admin bg-paper text-body">
<header class="sticky top-0 z-40 border-b border-line bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 px-5 sm:h-16 sm:flex-nowrap">
    <a href="/" aria-label="SkibiDink home" class="shrink-0 py-4 sm:py-0"><img src="/img/logo.png" alt="SkibiDink" width="1218" height="230" class="h-7 w-auto"></a>
    <nav id="tabs" class="order-last -mx-1 hidden w-full gap-1 pb-2 text-sm font-semibold sm:order-none sm:mx-0 sm:ml-6 sm:mr-auto sm:w-auto sm:pb-0" role="tablist">
      <button type="button" class="admin-tab" data-tab="requests" role="tab">Requests <span id="tab-count" class="ml-1 hidden rounded-full bg-amber-400 px-1.5 text-[11px] text-ink"></span></button>
      <button type="button" class="admin-tab" data-tab="calendar" role="tab">Calendar</button>
      <button type="button" class="admin-tab" data-tab="dashboard" role="tab">Dashboard</button>
    </nav>
    <button id="logout" type="button" class="ml-auto hidden shrink-0 text-sm text-muted hover:text-ink">Sign out</button>
  </div>
</header>

<main class="mx-auto max-w-6xl px-5 py-8">
  <section id="login" class="mx-auto mt-16 hidden max-w-sm rounded-2xl border border-line bg-white p-6 shadow-xl shadow-slate-900/5">
    <h1 class="text-2xl font-extrabold">Admin</h1>
    <p class="mt-1 text-sm text-muted">Reservations, calendar and numbers.</p>
    <form id="login-form" class="mt-6 grid gap-3">
      <label class="grid gap-1 text-sm font-semibold">Password<input id="password" type="password" autocomplete="current-password" required class="field"></label>
      <button type="submit" class="btn-primary">Sign in</button>
      <p id="login-error" class="min-h-5 text-sm text-red-600" role="alert"></p>
    </form>
  </section>

  <section id="panel-requests" class="admin-panel hidden">
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="mr-auto text-3xl font-extrabold">Requests</h1>
      <button id="walkin-open" type="button" class="btn-primary px-4! py-2.5! text-sm">+ Walk-in booking</button>
    </div>
    <form id="walkin" class="mt-5 hidden grid-cols-2 gap-3 rounded-2xl border border-line bg-white p-4 sm:grid-cols-4 sm:p-5">
      <label class="admin-label col-span-2">Name<input name="name" required class="field"></label>
      <label class="admin-label col-span-2 sm:col-span-1">Phone<input name="phone" inputmode="tel" maxlength="30" placeholder="0917 123 4567" class="field"></label>
      <label class="admin-label col-span-2 sm:col-span-1">Facebook<input name="facebook" class="field"></label>
      <label class="admin-label">Day<input name="date" type="date" required class="field"></label>
      <label class="admin-label">Start<select name="hour" class="field" data-hours></select></label>
      <label class="admin-label">Hours<input name="hours" type="number" min="1" max="17" value="1" required class="field"></label>
      <label class="admin-label">Players<input name="players" type="number" min="1" max="16" value="4" required class="field"></label>
      <label class="admin-label col-span-2 sm:col-span-3">Note<input name="note" class="field"></label>
      <label class="col-span-2 flex items-center gap-2 self-end pb-3 text-sm font-semibold sm:col-span-1"><input name="paid" type="checkbox" class="size-4 accent-skibi"> Paid already</label>
      <div class="col-span-2 flex flex-wrap items-center gap-3 sm:col-span-4">
        <button type="submit" class="btn bg-skibi px-5! py-2.5! text-sm text-white hover:bg-skibi-dark">Save as confirmed</button>
        <button id="walkin-close" type="button" class="text-sm text-muted hover:text-ink">Cancel</button>
        <p id="walkin-error" class="text-sm text-red-600" role="alert"></p>
      </div>
    </form>
    <div class="mt-6 grid gap-3 sm:grid-cols-[1fr_11rem] lg:flex lg:items-center">
      <input id="search" type="search" placeholder="Search name, phone, Facebook, date or #id" class="field lg:w-80" aria-label="Search">
      <div id="filters" class="-mx-5 flex gap-2 overflow-x-auto px-5 text-sm whitespace-nowrap sm:col-span-2 sm:row-start-2 lg:mx-0 lg:px-0"></div>
      <select id="scope" class="field sm:col-start-2 sm:row-start-1 lg:ml-auto lg:w-40" aria-label="Which dates">
        <option value="upcoming">Upcoming</option>
        <option value="past">Past</option>
        <option value="all">All dates</option>
      </select>
    </div>
    <div id="list" class="mt-6 grid gap-8" aria-live="polite"></div>
  </section>

  <section id="panel-calendar" class="admin-panel hidden">
    <div class="flex flex-wrap items-center gap-3">
      <h1 id="cal-title" class="mr-auto text-3xl font-extrabold">Calendar</h1>
      <div class="flex rounded-lg border border-line bg-white p-1 text-sm font-semibold" role="tablist" aria-label="View">
        <button type="button" class="cal-view" data-view="day">Day</button>
        <button type="button" class="cal-view" data-view="week">Week</button>
        <button type="button" class="cal-view" data-view="month">Month</button>
      </div>
      <div class="flex gap-1">
        <button id="cal-prev" type="button" class="btn-ghost px-3! py-2! text-sm" aria-label="Previous">&larr;</button>
        <button id="cal-today" type="button" class="btn-ghost px-3! py-2! text-sm">Today</button>
        <button id="cal-next" type="button" class="btn-ghost px-3! py-2! text-sm" aria-label="Next">&rarr;</button>
      </div>
      <a id="cal-download" class="btn bg-skibi px-4! py-2.5! text-sm text-white hover:bg-skibi-dark" href="#" download>Download picture</a>
    </div>
    <div id="cal" class="mt-6"></div>
  </section>

  <section id="panel-dashboard" class="admin-panel hidden">
    <h1 class="text-3xl font-extrabold">Dashboard</h1>
    <div id="tiles" class="mt-6 grid grid-cols-2 gap-3 md:grid-cols-4"></div>
    <div class="mt-6 grid gap-6 lg:grid-cols-2">
      <figure class="chart-card lg:col-span-2"><figcaption class="chart-title">Players per month</figcaption><div id="chart-months" class="chart"></div></figure>
      <figure class="chart-card"><figcaption class="chart-title">Busiest hours</figcaption><div id="chart-hours" class="chart"></div></figure>
      <figure class="chart-card"><figcaption class="chart-title">Bookings by weekday</figcaption><div id="chart-days" class="chart"></div></figure>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script defer src="/js/admin.js"></script>
</body>
</html>
