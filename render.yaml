services:
  - type: web
    name: skibidink
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - knowledge/**
        - router/**
        - "*.md"
        - .claude/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EDGE_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRICE_PER_HOUR
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MALLOC_ARENA_MAX
        value: "2"
